<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Interactivo 1971–2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== PORTRAIT LOCK ===== -->
  <div id="portrait-lock">
    <div id="rotate-icon" onclick="tryRotate()">📱↺</div>
    <p>Gira tu dispositivo</p>
    <small>para una mejor experiencia</small>
  </div>

  <!-- ===== LOADER ===== -->
  <div id="loader">
    <div id="balon-loader-wrap">
      <img id="balon-loader-img"
           src="assets/centro-balon-loader.webp" alt="cargando"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23222%22 stroke=%22%23fff%22 stroke-width=%222%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2248%22>⚽</text></svg>'">
    </div>
    <div class="load-bars">
      <div class="bar-track"><div class="bar-fill-top" id="bar-top"></div></div>
      <div class="bar-track"><div class="bar-fill-bot" id="bar-bot"></div></div>
    </div>
    <div id="load-text">Cargando…</div>
  </div>

  <!-- ===== MAIN SCENE ===== -->
  <div id="scene">

    <!-- FONDO BASE -->
    <img id="fondo" src="assets/mural-fondo-base.webp" alt="fondo">

    <!-- AÑO LABELS -->
    <div id="lbl-1971">1971</div>
    <div id="lbl-2026">2026 ∞</div>

    <!-- ========== LADO PASADO ========== -->

    <!-- Público 1 — capa inferior, ola A -->
    <div class="el ola-a" id="el-pub1"
         style="left:2%;top:2%;width:42%;height:92%;z-index:2;">
      <img src="assets/p1971-publico-1.webp" alt="publico 1">
    </div>

    <!-- Público 2 — capa superior, ola B (encima de pub1) -->
    <div class="el ola-b" id="el-pub2"
         style="left:2%;top:2%;width:42%;height:92%;z-index:3;">
      <img src="assets/p1971-publico-2.webp" alt="publico 2">
    </div>

    <!-- Letrero Azteca -->
    <div class="el alt-outer" id="el-letrero"
         style="left:18%;top:3%;width:20%;height:22%;z-index:6;--dur:4.5s;--del:1s">
      <img src="assets/p1971-letrero-azteca.webp" alt="letrero azteca">
    </div>

    <!-- Jugadoras 1971 -->
    <div class="el alt-inner" id="el-jugadoras"
         style="left:0%;top:35%;width:44%;height:60%;z-index:5;--dur:6s;--del:0.5s">
      <img src="assets/p1971-jugadoras.webp" alt="jugadoras 1971">
    </div>

    <!-- Texto historia -->
    <div class="el alt-outer" id="el-txthist"
         style="left:1%;top:2%;width:20%;height:14%;z-index:6;--dur:4s;--del:2s">
      <img src="assets/p1971-texto-historia.webp" alt="texto historia">
    </div>

    <!-- Créditos -->
    <div class="el alt-inner" id="el-creditos"
         style="left:0.5%;bottom:1%;width:9%;height:13%;z-index:7;--dur:3.5s;--del:3s">
      <img src="assets/p1971-creditos.webp" alt="creditos">
    </div>

    <!-- ========== CENTRO ========== -->

    <!-- Grieta negra — ancha, full height -->
    <div class="el" id="el-grieta-negra"
         style="left:38%;top:0%;width:24%;height:100%;z-index:8;">
      <img src="assets/centro-grieta-negra.webp" alt="grieta negra">
    </div>

    <!-- Grieta verde — efecto loading, encima -->
    <div class="el" id="el-grieta-verde"
         style="left:39%;top:0%;width:22%;height:100%;z-index:9;">
      <img src="assets/centro-grieta-verde.webp" alt="grieta verde">
    </div>

    <!-- Balón central -->
    <div class="el" id="el-balon-center"
         style="left:44%;top:30%;width:12%;height:22%;z-index:11;">
      <img src="assets/centro-balon-loader.webp" alt="balon"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23111%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2248%22>⚽</text></svg>'">
    </div>

    <!-- ========== LADO PRESENTE ========== -->

    <!-- Futbolista — más a la izquierda del grupo, grande -->
    <div class="el alt-outer" id="el-futbolista"
         style="left:52%;top:5%;width:16%;height:88%;z-index:5;--dur:5s;--del:0s">
      <img src="assets/f2026-futbolista.webp" alt="futbolista">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Futbolista</span>
    </div>

    <!-- Maestra -->
    <div class="el alt-inner" id="el-maestra"
         style="left:57%;top:25%;width:15%;height:70%;z-index:4;--dur:5s;--del:3s">
      <img src="assets/f2026-maestra.webp" alt="maestra">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Maestra</span>
    </div>

    <!-- Doctora -->
    <div class="el alt-inner" id="el-doctora"
         style="left:63%;top:5%;width:14%;height:78%;z-index:5;--dur:5.5s;--del:1.2s">
      <img src="assets/f2026-doctora.webp" alt="doctora">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Doctora</span>
    </div>

    <!-- Bombera -->
    <div class="el alt-outer" id="el-bombera"
         style="left:68%;top:35%;width:13%;height:60%;z-index:4;--dur:4.5s;--del:0.8s">
      <img src="assets/f2026-bombera.webp" alt="bombera">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Bombera</span>
    </div>

    <!-- Ingeniera -->
    <div class="el alt-outer" id="el-ingeniera"
         style="left:73%;top:3%;width:13%;height:75%;z-index:5;--dur:6s;--del:2.4s">
      <img src="assets/f2026-ingeniera.webp" alt="ingeniera">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Ingeniera</span>
    </div>

    <!-- Repartidora -->
    <div class="el alt-inner" id="el-repartidora"
         style="left:80%;top:15%;width:12%;height:70%;z-index:5;--dur:5s;--del:1.6s">
      <img src="assets/f2026-repartidora.webp" alt="repartidora">
      <span class="label" style="bottom:-5%;left:50%;transform:translateX(-50%)">Repartidora</span>
    </div>

    <!-- Profesionistas -->
    <div class="el alt-outer" id="el-prof"
         style="left:85%;top:10%;width:10%;height:65%;z-index:4;--dur:5s;--del:3.5s">
      <img src="assets/f2026-profecionistas.webp" alt="profesionistas">
    </div>

    <!-- Niña base -->
    <div class="el alt-inner" id="el-nina"
         style="left:89%;top:38%;width:10%;height:58%;z-index:6;--dur:3s;--del:0s">
      <img src="assets/nina-base.webp" alt="nina">
    </div>

    <!-- Texto 2026 -->
    <div class="el alt-outer" id="el-txt2026"
         style="left:82%;top:2%;width:17%;height:18%;z-index:7;--dur:4s;--del:2s">
      <img src="assets/f2026-texto-nosotras.webp" alt="texto nosotras">
    </div>

  </div><!-- /scene -->

  <!-- AUDIO -->
  <audio id="audio-ambiente" src="assets/audios/ambiente.mp3" loop preload="auto"></audio>

  <script src="main.js"></script>
</body>
</html>
